[workspace]

[package]
name = "stem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stem-core = { path = "../crates/stem-core" }
stem-audio = { path = "../crates/stem-audio" }

[[bin]]
name = "fuzz_ron_project"
path = "fuzz_targets/fuzz_ron_project.rs"
test = false
doc = false

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false

[profile.release]
panic = "unwind"

