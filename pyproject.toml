[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-audio"
version = "1.0.1"
description = "steM. — AI Audio Separation Studio."
readme = "README.md"
authors = [
    { name = "M. Özçelik" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "PyGObject>=3.48.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "demucs>=4.0.0",
    "soundfile>=0.12.1",
    "static-ffmpeg>=2.5",
]

[project.urls]
Homepage = "https://github.com/MOzcelik14/steM"
Repository = "https://github.com/MOzcelik14/steM"
Issues = "https://github.com/MOzcelik14/steM/issues"

[project.scripts]
stem = "stem.app:main"

[tool.setuptools.packages.find]
include = ["stem", "stem.*"]
