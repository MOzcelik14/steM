[workspace]
resolver = "2"
members = [
    "crates/stem-i18n",
    "crates/stem-core",
    "crates/stem-dsp",
    "crates/stem-audio",
    "crates/stem-app",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["steM. Contributors"]
license = "GPL-3.0"
repository = "https://github.com/MOzcelik14/steM"
homepage = "https://github.com/MOzcelik14/steM"
readme = "README.md"

[workspace.dependencies]
stem-i18n = { path = "crates/stem-i18n" }
stem-core = { path = "crates/stem-core" }
stem-dsp = { path = "crates/stem-dsp" }
stem-audio = { path = "crates/stem-audio" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
rtrb = "0.3"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
hound = "3.5"
flacenc = "0.4"
rubato = "0.15"
realfft = "3.3"
rustfft = "6.2"
ebur128 = "0.1"
rand = { version = "0.8", features = ["small_rng"] }
crossbeam-channel = "0.5"
fluent-bundle = "0.15"
unic-langid = "0.9"
sys-locale = "0.3"
eframe = { version = "0.29", default-features = true }
egui = "0.29"
rfd = "0.15"
