<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#090B12"/>
    </linearGradient>

    <!-- Inner console recess gradient -->
    <linearGradient id="recessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C101A"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>

    <!-- Stem bar gradients -->
    <linearGradient id="stemCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="stemMaster" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#7DD3FC"/>
      <stop offset="60%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="stemIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Subtle Glow filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base container: Dark Studio Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#222B3D" stroke-width="3"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.2"/>

  <!-- Inner Studio Track Recess -->
  <rect x="64" y="112" width="384" height="288" rx="24" fill="url(#recessGrad)" stroke="#1A2234" stroke-width="2"/>

  <!-- Studio dB Grid Lines -->
  <line x1="84" y1="184" x2="428" y2="184" stroke="#1E273A" stroke-width="1.5" stroke-dasharray="6,8"/>
  <line x1="84" y1="256" x2="428" y2="256" stroke="#25324B" stroke-width="1.5"/>
  <line x1="84" y1="328" x2="428" y2="328" stroke="#1E273A" stroke-width="1.5" stroke-dasharray="6,8"/>

  <!-- Left/Right track meter scale tick marks -->
  <line x1="80" y1="184" x2="92" y2="184" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="76" y1="256" x2="94" y2="256" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="80" y1="328" x2="92" y2="328" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>

  <line x1="420" y1="184" x2="432" y2="184" stroke="#818CF8" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="418" y1="256" x2="436" y2="256" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.8"/>
  <line x1="420" y1="328" x2="432" y2="328" stroke="#818CF8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Multitrack Stem Waveform Bars (10 precision rounded stems) -->
  <rect x="116" y="232" width="12" height="48" rx="6" fill="#38BDF8" fill-opacity="0.35"/>
  <rect x="142" y="212" width="13" height="88" rx="6.5" fill="#38BDF8" fill-opacity="0.55"/>
  <rect x="169" y="184" width="15" height="144" rx="7.5" fill="url(#stemCyan)" fill-opacity="0.8"/>
  <rect x="198" y="158" width="17" height="196" rx="8.5" fill="url(#stemCyan)"/>
  <rect x="229" y="138" width="19" height="236" rx="9.5" fill="url(#stemMaster)"/>

  <!-- Central Master Playhead Laser -->
  <line x1="256" y1="104" x2="256" y2="408" stroke="#00F0FF" stroke-width="2.5" opacity="0.85"/>

  <!-- Stem 6 (Lead Right) -->
  <rect x="264" y="138" width="19" height="236" rx="9.5" fill="url(#stemMaster)"/>
  <rect x="296" y="158" width="17" height="196" rx="8.5" fill="url(#stemIndigo)"/>
  <rect x="328" y="184" width="15" height="144" rx="7.5" fill="url(#stemIndigo)" fill-opacity="0.8"/>
  <rect x="357" y="212" width="13" height="88" rx="6.5" fill="#818CF8" fill-opacity="0.55"/>
  <rect x="384" y="232" width="12" height="48" rx="6" fill="#818CF8" fill-opacity="0.35"/>

  <!-- Continuous Analog Frequency Curve -->
  <path d="M 88,256 C 130,256 142,196 176,196 C 210,196 220,146 256,146 C 292,146 302,196 336,196 C 370,196 382,256 424,256"
        fill="none" stroke="url(#waveGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Opposing audio reflection curve (lower envelope) -->
  <path d="M 88,256 C 130,256 142,316 176,316 C 210,316 220,366 256,366 C 292,366 302,316 336,316 C 370,316 382,256 424,256"
        fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Playhead Head Pointer (Top) -->
  <polygon points="256,92 245,108 267,108" fill="#00F0FF" filter="url(#neonGlow)"/>
  <!-- Playhead Bottom Anchor -->
  <polygon points="256,420 245,404 267,404" fill="#00F0FF"/>

  <!-- Playhead Center Node Pulse -->
  <circle cx="256" cy="256" r="6.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="13" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.75"/>

  <!-- Brand Dot (Signature Suite Element) -->
  <circle cx="418" cy="428" r="12" fill="#00F0FF" filter="url(#dotGlow)"/>
  <circle cx="418" cy="428" r="18" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.4"/>
</svg>