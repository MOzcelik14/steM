<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241442"/>
      <stop offset="50%" stop-color="#151620"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>

    <!-- Purple Stem Gradient -->
    <linearGradient id="purpleStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d07aff"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <!-- Amber Stem Gradient -->
    <linearGradient id="amberStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b"/>
      <stop offset="100%" stop-color="#fb5607"/>
    </linearGradient>

    <!-- Cyan Stem Gradient -->
    <linearGradient id="cyanStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <!-- Green Stem Gradient -->
    <linearGradient id="greenStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Squircle Base (Libadwaita shape) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#4a287a" stroke-width="1.5"/>

  <!-- Subtle Studio Grid Rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="rgba(157, 78, 221, 0.15)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="64" cy="64" r="30" fill="none" stroke="rgba(157, 78, 221, 0.2)" stroke-width="1"/>

  <!-- AI Separated Sound Waves (4 Stems) -->
  <!-- 1. Bass (Cyan) -->
  <path d="M 28 64 C 28 42, 38 42, 38 64 C 38 86, 48 86, 48 64" fill="none" stroke="url(#cyanStem)" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- 2. Drums (Amber) -->
  <path d="M 46 64 C 46 32, 58 32, 58 64 C 58 96, 70 96, 70 64" fill="none" stroke="url(#amberStem)" stroke-width="5" stroke-linecap="round"/>

  <!-- 3. Vocals (Vibrant Purple - Central Hero) -->
  <path d="M 64 64 C 64 22, 78 22, 78 64 C 78 106, 92 106, 92 64" fill="none" stroke="url(#purpleStem)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- 4. Other (Green) -->
  <path d="M 88 64 C 88 48, 98 48, 98 64 C 98 80, 106 80, 106 64" fill="none" stroke="url(#greenStem)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Focal Core Point -->
  <circle cx="64" cy="64" r="4" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Dot in steM. brand -->
  <circle cx="98" cy="98" r="3.5" fill="#9d4edd"/>
</svg>
