name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 · deb + rpm + AppImage + tar.gz
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            pkg-config build-essential libasound2-dev libx11-dev libgl1-mesa-dev \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            rpm libfuse2 file curl
          curl -fsSL -o /tmp/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --locked --release -p stem-app
      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          mkdir -p dist

          # 1. Portable tar.gz
          NAME="stem-${VER}-linux-x86_64"
          mkdir -p "dist/$NAME"
          install -m 755 target/release/stem "dist/$NAME/stem"
          cp README.md LICENSE "dist/$NAME/"
          cp -r assets "dist/$NAME/assets" || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -rf "dist/$NAME"

          # 2. Debian .deb
          DEB_STAGE="$(mktemp -d)"
          mkdir -p "${DEB_STAGE}/DEBIAN" "${DEB_STAGE}/usr/bin" "${DEB_STAGE}/usr/share/applications" "${DEB_STAGE}/usr/share/icons/hicolor/256x256/apps"
          install -m 755 target/release/stem "${DEB_STAGE}/usr/bin/stem"
          cp assets/icon.png "${DEB_STAGE}/usr/share/icons/hicolor/256x256/apps/stem.png"
          cat > "${DEB_STAGE}/usr/share/applications/stem.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=steM.
          Comment=Non-destructive multi-track audio workstation and waveform editor
          Exec=stem %f
          Icon=stem
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;AudioVideoEditing;
          DESKTOP
          cat > "${DEB_STAGE}/DEBIAN/control" <<CONTROL
          Package: stem
          Version: ${VER}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: steM. Contributors
          Description: Multi-track audio workstation and waveform editor in Rust
          CONTROL
          dpkg-deb --build --root-owner-group "${DEB_STAGE}" "dist/stem_${VER}_amd64.deb"
          rm -rf "${DEB_STAGE}"

          # 3. Fedora/RHEL .rpm
          RPM_TOP="$(mktemp -d)"
          mkdir -p "${RPM_TOP}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/release/stem "${RPM_TOP}/SOURCES/stem"
          cp assets/icon.png "${RPM_TOP}/SOURCES/stem.png"
          cat > "${RPM_TOP}/SPECS/stem.spec" <<SPEC
          %global debug_package %{nil}
          Name:           stem
          Version:        ${VER}
          Release:        1%{?dist}
          Summary:        Multi-track audio workstation and waveform editor
          License:        GPL-3.0-or-later
          URL:            https://github.com/MOzcelik14/steM

          %description
          Non-destructive multi-track audio workstation and waveform editor in Rust.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}%{_bindir} %{buildroot}%{_datadir}/applications %{buildroot}%{_datadir}/icons/hicolor/256x256/apps
          install -m 0755 "%{_sourcedir}/stem" %{buildroot}%{_bindir}/stem
          install -m 0644 "%{_sourcedir}/stem.png" %{buildroot}%{_datadir}/icons/hicolor/256x256/apps/stem.png
          cat > %{buildroot}%{_datadir}/applications/stem.desktop <<'DESKTOP'
          [Desktop Entry]
          Name=steM.
          Comment=Non-destructive multi-track audio workstation and waveform editor
          Exec=stem %f
          Icon=stem
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;AudioVideoEditing;
          DESKTOP

          %files
          %{_bindir}/stem
          %{_datadir}/applications/stem.desktop
          %{_datadir}/icons/hicolor/256x256/apps/stem.png
          SPEC
          rpmbuild -bb --target x86_64 --define "_topdir ${RPM_TOP}" --define "_sourcedir ${RPM_TOP}/SOURCES" "${RPM_TOP}/SPECS/stem.spec"
          find "${RPM_TOP}/RPMS" -name "*.rpm" -exec cp {} "dist/stem-${VER}-1.x86_64.rpm" \;
          rm -rf "${RPM_TOP}"

          # 4. AppImage
          APPDIR="$(mktemp -d)/steM.AppDir"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/share/applications" "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          install -m 755 target/release/stem "${APPDIR}/usr/bin/stem"
          cp assets/icon.png "${APPDIR}/stem.png"
          cp assets/icon.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/stem.png"
          cat > "${APPDIR}/stem.desktop" <<'DESKTOP'
          [Desktop Entry]
          Name=steM.
          Comment=Non-destructive multi-track audio workstation and waveform editor
          Exec=stem %f
          Icon=stem
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;AudioVideoEditing;
          DESKTOP
          cp "${APPDIR}/stem.desktop" "${APPDIR}/usr/share/applications/stem.desktop"
          cat > "${APPDIR}/AppRun" <<'APPRUN'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/stem" "$@"
          APPRUN
          chmod 755 "${APPDIR}/AppRun"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool-x86_64.AppImage "${APPDIR}" "dist/steM-${VER}-x86_64.AppImage"
          rm -rf "$(dirname "${APPDIR}")"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stem-linux-package
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64 · zip (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release binary
        run: cargo build --locked --release -p stem-app
      - name: Package zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1)
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart('v') }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "stem-stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target\release\stem.exe" $stage
          Copy-Item "README.md" $stage
          Copy-Item "LICENSE" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\stem-$ver-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stem-windows-package
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS arm64 · dmg + tar.gz
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release binary
        run: cargo build --locked --release -p stem-app
      - name: Package macOS dmg and tar.gz
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          mkdir -p dist

          STAGE="$(mktemp -d)"
          PKG="${STAGE}/stem-${VER}-macos-arm64"
          mkdir -p "${PKG}"
          cp target/release/stem "${PKG}/stem"
          cp README.md LICENSE "${PKG}/"
          cp -r assets "${PKG}/assets" || true
          tar -C "${STAGE}" -czf "dist/stem-${VER}-macos-arm64.tar.gz" "stem-${VER}-macos-arm64"
          rm -rf "${STAGE}"

          DMG_STAGE="$(mktemp -d)"
          APP_DIR="${DMG_STAGE}/steM..app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp target/release/stem "${APP_DIR}/Contents/MacOS/stem"
          chmod +x "${APP_DIR}/Contents/MacOS/stem"

          if [ -f assets/icon.png ]; then
            ICONSET="$(mktemp -d)/stem.iconset"
            mkdir -p "${ICONSET}"
            sips -z 16 16     assets/icon.png --out "${ICONSET}/icon_16x16.png" >/dev/null
            sips -z 32 32     assets/icon.png --out "${ICONSET}/icon_16x16@2x.png" >/dev/null
            sips -z 32 32     assets/icon.png --out "${ICONSET}/icon_32x32.png" >/dev/null
            sips -z 64 64     assets/icon.png --out "${ICONSET}/icon_32x32@2x.png" >/dev/null
            sips -z 128 128   assets/icon.png --out "${ICONSET}/icon_128x128.png" >/dev/null
            sips -z 256 256   assets/icon.png --out "${ICONSET}/icon_128x128@2x.png" >/dev/null
            sips -z 256 256   assets/icon.png --out "${ICONSET}/icon_256x256.png" >/dev/null
            sips -z 512 512   assets/icon.png --out "${ICONSET}/icon_256x256@2x.png" >/dev/null
            iconutil -c icns "${ICONSET}" -o "${APP_DIR}/Contents/Resources/stem.icns"
          fi

          cat > "${APP_DIR}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>stem</string>
            <key>CFBundleIdentifier</key><string>com.mozcelik14.stem</string>
            <key>CFBundleName</key><string>steM.</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>stem</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          ln -s /Applications "${DMG_STAGE}/Applications"
          hdiutil create -volname "steM. ${VER}" -srcfolder "${DMG_STAGE}" -ov -format UDZO "dist/stem-${VER}-macos-arm64.dmg"
          rm -rf "${DMG_STAGE}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stem-macos-package
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stem-*-package
          merge-multiple: true
          path: dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- *.deb *.rpm *.AppImage *.dmg *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
