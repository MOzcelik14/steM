name: Build & Release (Linux & Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-python-numpy
            mingw-w64-ucrt-x86_64-python-scipy
            mingw-w64-ucrt-x86_64-python-soundfile
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-pyinstaller

      - name: Verify GTK4, Libadwaita, and Audio dependencies
        shell: msys2 {0}
        run: |
          python -c "import gi, soundfile, numpy, scipy; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); gi.require_version('Gst', '1.0'); from gi.repository import Gtk, Adw, Gst; print('GTK4, Libadwaita, GStreamer, and Audio stack verified successfully!')"

      - name: Run automated test suite
        shell: msys2 {0}
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build standalone executable with PyInstaller
        shell: msys2 {0}
        run: |
          python scripts/build_windows.py

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: steM-Windows-x64
          path: dist/steM-Windows-x64.zip
          retention-days: 14

  build-linux-deb:
    name: Build Linux Package (.deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            libsndfile1 python3-soundfile python3-numpy python3-scipy dpkg-dev xvfb

      - name: Run automated test suite
        run: |
          xvfb-run -a python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Debian (.deb) package
        run: |
          bash scripts/build_deb.sh

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: steM-Linux-deb
          path: dist/steM-Linux-1.0.0.deb
          retention-days: 14

  publish-release:
    name: Publish Release to GitHub
    needs: [build-windows, build-linux-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: steM-Windows-x64
          path: release-assets

      - name: Download Linux deb artifact
        uses: actions/download-artifact@v4
        with:
          name: steM-Linux-deb
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/steM-Windows-x64.zip
            release-assets/steM-Linux-1.0.0.deb
          generate_release_notes: true
